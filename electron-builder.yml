appId: com.muin.atoj
productName: AtoJ
directories:
  buildResources: build
  output: release
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!tests/*"
  - "!legacy_src/*"
  - "!_규격서/*"
  - "!viewer/*"
  - "!AtoJ.exe"
  - "!electron.vite.config.*"
  - "!vitest.config.*"
  - "!tsconfig.*"
asarUnpack:
  - "**/*.node"
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
